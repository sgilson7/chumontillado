<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Reference default. connect-src is this origin and the relays that
       introduce browsers for online play (M4), exactly web/net/config.js's
       list (online_fence.rs holds them equal); 'wasm-unsafe-eval' lets the
       page compile its own WebAssembly module; form-action 'none' blocks
       form posts. A meta policy cannot stop data leaving by navigation, so
       the browser check still watches requests. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' wss://nos.lol wss://nostr.mom wss://relay.damus.io wss://relay.primal.net wss://nostr-01.yakihonne.com wss://nostr.sathoarder.com wss://relay.mostro.network; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Chumontillado</title>
  <link rel="stylesheet" href="style.css?v=413bde2340e1">
</head>
<body data-ready="false" data-screen="loading">
  <canvas id="view"></canvas>
  <div id="crosshair" aria-hidden="true"></div>
  <div id="hud" aria-live="polite"></div>
  <div id="overlay" hidden></div>
  <div id="loading" role="status"><span id="loading-text"></span></div>
  <p id="message" role="alert"></p>
  <!-- M4: this browser's checksums of the online match, for the online check -->
  <p id="online-sums" hidden></p>
  <noscript><p>This page needs JavaScript and WebAssembly.</p></noscript>
  <script type="module" src="app.js?v=413bde2340e1"></script>
</body>
</html>
